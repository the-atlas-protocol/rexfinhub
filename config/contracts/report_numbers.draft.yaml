# =============================================================================
# REPORT RULES (DRAFT) — the rules the computer reads
# =============================================================================
# This is the machine-readable version of what's in your head and in
# docs/REPORT_NUMBERS.md. Nothing reads this file yet — it's a draft for Ryu to
# check. Once approved, three parts of the system read it:
#   1. the AI classifier  -> uses "means" + "looks_wrong_if" to label funds right
#   2. the safety check    -> refuses to send a report if a number breaks its rule
#   3. the reports         -> compute each number ONE way, from "rule_expr"
#
# How to read each entry: plain-English fields first (means / looks_wrong_if),
# then the precise version the code uses (rule_expr). If the plain English is
# wrong, the number is wrong — that's the whole point.
#
# SCOPE OF THIS DRAFT: L&I + Income headline numbers only. We expand later.
# =============================================================================


# -----------------------------------------------------------------------------
# PART 1 — DEFINITIONS: what each label MEANS (this is what the AI was missing)
# -----------------------------------------------------------------------------
definitions:

  - field: etp_category
    value: LI
    name: Leveraged & Inverse
    means: >
      A fund that gives daily-reset 2x or 3x leverage, OR inverse/short exposure.
    is_not: >
      A 130/30 long-short fund, an ultrashort-treasury fund, or anything that is
      not daily-reset leverage. These are NOT L&I.
    looks_wrong_if: >
      There is no leverage multiple (2x/3x) and no inverse/short language in the
      fund name or description.

  - field: etp_category
    value: CC
    name: Income (covered-call / option income)
    means: >
      A fund that makes income using an OPTIONS strategy — covered calls,
      option-income, or autocallable.
    is_not: >
      Plain bond / treasury / muni / CLO income, plain dividend-equity, or a
      hedged-equity collar. These pay income but have NO options strategy, so
      they are NOT CC. (If REX ever wants a separate dividend-income bucket, that
      is a deliberate definition change — not a silent reclassification.)
    looks_wrong_if: >
      The description is about bonds, treasuries, dividends, or "fixed income"
      with no mention of options, calls, puts, or premium.


# -----------------------------------------------------------------------------
# PART 2 — SHARED RULES: apply to many numbers, stated once
# -----------------------------------------------------------------------------
shared_rules:

  - id: active_only
    plain: >
      "Current" counts use live (ACTV) funds only. PEND = not launched yet
      (exclude). LIQU / DLST = closed (exclude from current counts).

  - id: aum_closed_is_zero
    plain: >
      AUM uses live funds. A closed fund shows $0 today but keeps its real
      history. Past a fund's delist date, its AUM is 0 from that point on.

  - id: microsectors_true_aum
    plain: >
      MicroSectors ETNs use the TRUE AUM from the override sheet, never
      Bloomberg's inflated issuance number (Bloomberg overstates ~5-10x).

  - id: brand_not_legal_entity
    plain: >
      The issuer shown must be a real brand, never a legal entity. A name
      containing "Trust" is wrong UNLESS it is First Trust or Northern Trust.


# -----------------------------------------------------------------------------
# PART 3 — NUMBERS: each headline figure, its rule, what it should be, what
#                   "wrong" looks like
# -----------------------------------------------------------------------------
numbers:

  - id: trex_single_stock_li_actv
    label: T-REX single-stock L&I (live)
    means: How many of REX's live single-stock leveraged/inverse ETPs there are.
    source: mkt_master_data
    rule_plain: >
      REX fund, category = L&I, single-stock, live (ACTV) only.
    rule_expr: >
      is_rex = true AND etp_category = 'LI'
      AND category_display CONTAINS 'Single Stock'
      AND market_status = 'ACTV'
    uses_shared: [active_only]
    expected: 41
    looks_wrong_if: >
      The count jumps with no new launch; a not-yet-launched (PEND) or delisted
      fund is counted; or an index/basket fund slips in.

  - id: microsectors_index_li_actv
    label: MicroSectors index L&I (live)
    means: How many live MicroSectors index/basket leveraged/inverse ETNs there are.
    source: mkt_master_data
    rule_plain: >
      MicroSectors suite, category = L&I, index/basket (not single-stock),
      live (ACTV) only. Includes DULL, AIQU, AIQD.
    rule_expr: >
      rex_suite = 'MicroSectors' AND etp_category = 'LI'
      AND category_display CONTAINS 'Index'
      AND market_status = 'ACTV'
    uses_shared: [active_only, microsectors_true_aum]
    expected: 22
    looks_wrong_if: >
      A single-stock fund is counted here; AUM uses Bloomberg's inflated number
      instead of the override; a closed ETN still counts.

  - id: rex_income_single_stock_actv
    label: REX income single-stock (live)
    means: REX's live single-stock option-income funds.
    source: mkt_master_data
    rule_plain: >
      REX fund, category = Income (CC), single-stock, live (ACTV) only.
    rule_expr: >
      is_rex = true AND etp_category = 'CC'
      AND category_display CONTAINS 'Single Stock'
      AND market_status = 'ACTV'
    uses_shared: [active_only]
    expected: 3
    expected_members: [NVII, TSII, WMTI]
    looks_wrong_if: >
      A bond or plain-dividend fund is counted as income; the list isn't exactly
      NVII / TSII / WMTI; a pending fund is included.

  - id: rex_income_index_actv
    label: REX income index (live)
    means: REX's live index/basket option-income funds.
    source: mkt_master_data
    rule_plain: >
      REX fund, category = Income (CC), index/basket, live (ACTV) only.
    rule_expr: >
      is_rex = true AND etp_category = 'CC'
      AND category_display CONTAINS 'Index'
      AND market_status = 'ACTV'
    uses_shared: [active_only]
    expected: 8
    looks_wrong_if: >
      A single-stock income fund is counted here; a fixed-income (bond) fund is
      miscounted as option-income.

  - id: rex_total_actv
    label: REX total live ETPs (all suites)
    means: Every live REX product across all suites.
    source: mkt_master_data
    rule_plain: >
      REX fund, live (ACTV) only, all suites.
    rule_expr: >
      is_rex = true AND market_status = 'ACTV'
    uses_shared: [active_only]
    expected: 79
    looks_wrong_if: >
      Pending or closed funds are counted; the number doesn't equal the sum of
      the per-suite live counts.


