<!DOCTYPE html><html><head><meta charset="utf-8"><title>rexfinhub system architecture</title>
<style>
 body{margin:0;font-family:-apple-system,Segoe UI,sans-serif;background:#0f172a;color:#e2e8f0}
 #top{padding:10px 16px;background:#1e293b;border-bottom:1px solid #334155}
 #top h1{margin:0 0 4px;font-size:16px} #top p{margin:0;font-size:12px;color:#94a3b8}
 .legend span{display:inline-block;margin-right:14px;font-size:12px}
 .dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
 #canvas{overflow:auto} svg{display:block}

 .edge{stroke:#475569;fill:none;stroke-width:1}.edge.hot{stroke:#f59e0b;stroke-width:2.5}

</style></head><body>
<div id="top"><h1>rexfinhub &mdash; system architecture (sources &rarr; schedulers &rarr; pipeline &rarr; data &rarr; outputs)</h1>
<p>Health from the 2026-06-16 automation audit. Click any node to highlight its flow.</p>
<div class="legend"><span><i class="dot" style="background:#22c55e"></i>healthy</span>
<span><i class="dot" style="background:#f59e0b"></i>degraded</span>
<span><i class="dot" style="background:#ef4444"></i>broken / disabled</span>
<span style="color:#64748b">&nbsp;|&nbsp; scroll = zoom &middot; drag = pan &middot; click node = trace flow &middot; dbl-click = reset</span></span></div>
<input id="search" placeholder="search a component (e.g. sync, snapshot, Render, weekly, reconciler)"
 style="margin-top:6px;padding:5px 8px;width:380px;border-radius:5px;border:1px solid #475569;background:#0f172a;color:#e2e8f0"></div>
<div id="canvas"><svg id="svg"></svg></div>
<script>
const D = {"nodes": [{"id": "s_bbg", "lane": 0, "label": "Bloomberg daily xlsm", "sub": "SharePoint pull \u00b7 ~21:00 ET", "h": "ok", "x": 40, "y": 90}, {"id": "s_edgar", "lane": 0, "label": "SEC EDGAR", "sub": "485 filings + daily index", "h": "ok", "x": 40, "y": 130}, {"id": "s_cboe", "lane": 0, "label": "CBOE", "sub": "symbol reservation", "h": "bad", "x": 40, "y": 170}, {"id": "s_rules", "lane": 0, "label": "Rules CSVs (config/rules)", "sub": "fund_master \u00b7 attributes \u00b7 rex_funds", "h": "ok", "x": 40, "y": 210}, {"id": "t_chain", "lane": 1, "label": "bloomberg-chain", "sub": "Mon\u2013Fri 17:15 + 21:00 \u00b7 sync + 12 post-steps", "h": "ok", "x": 320, "y": 90}, {"id": "t_poller", "lane": 1, "label": "fresh-poller", "sub": "Mon\u2013Fri 08\u201320 /15min", "h": "ok", "x": 320, "y": 130}, {"id": "t_atom", "lane": 1, "label": "atom-watcher + worker", "sub": "continuous daemons", "h": "ok", "x": 320, "y": 170}, {"id": "t_sec", "lane": 1, "label": "sec-scrape", "sub": "08/12/16/20:00 \u00b7 runs run_daily", "h": "warn", "x": 320, "y": 210}, {"id": "t_intra", "lane": 1, "label": "intraday-refresh", "sub": "DISABLED (never enabled)", "h": "bad", "x": 320, "y": 250}, {"id": "t_recon", "lane": 1, "label": "reconciler", "sub": "daily 08:00", "h": "ok", "x": 320, "y": 290}, {"id": "t_sweep", "lane": 1, "label": "classification-sweep", "sub": "Mon\u2013Fri 09:00", "h": "ok", "x": 320, "y": 330}, {"id": "t_triage", "lane": 1, "label": "morning-triage", "sub": "08:00 \u00b7 assertions+email", "h": "bad", "x": 320, "y": 370}, {"id": "t_pre", "lane": 1, "label": "preflight", "sub": "18:30 \u00b7 DISABLED", "h": "bad", "x": 320, "y": 410}, {"id": "t_gate", "lane": 1, "label": "gate open/close", "sub": "open 19:00 DISABLED \u00b7 close 20:00", "h": "warn", "x": 320, "y": 450}, {"id": "t_backup", "lane": 1, "label": "db-backup", "sub": "daily 23:00", "h": "ok", "x": 320, "y": 490}, {"id": "p_sync", "lane": 2, "label": "sync_market_data", "sub": "full refresh + (ticker,etp_category) dedup", "h": "ok", "x": 660, "y": 90}, {"id": "p_class", "lane": 2, "label": "classify_daily", "sub": "rules\u2192LLM\u2192critic\u2192queue", "h": "ok", "x": 660, "y": 130}, {"id": "p_fm", "lane": 2, "label": "apply_fund_master", "sub": "curated 3-axis restamp", "h": "ok", "x": 660, "y": 170}, {"id": "p_iss", "lane": 2, "label": "derive+apply_issuer_brands", "sub": "issuer_display", "h": "ok", "x": 660, "y": 210}, {"id": "p_sweep", "lane": 2, "label": "apply_classification_sweep", "sub": "HIGH/MED auto-fill", "h": "ok", "x": 660, "y": 250}, {"id": "p_recon", "lane": 2, "label": "status_reconciler", "sub": "status_history \u2192 status_cached", "h": "ok", "x": 660, "y": 290}, {"id": "p_snap", "lane": 2, "label": "snapshot_daily", "sub": "append-only EOD history", "h": "ok", "x": 660, "y": 330}, {"id": "p_commit", "lane": 2, "label": "commit_rules_delta", "sub": "rules \u2192 git \u2192 Render", "h": "ok", "x": 660, "y": 370}, {"id": "p_assert", "lane": 2, "label": "run_assertions", "sub": "31 checks (08:00 tripwire)", "h": "warn", "x": 660, "y": 410}, {"id": "p_qc", "lane": 2, "label": "qc_all_reports", "sub": "input\u2192output report QC", "h": "ok", "x": 660, "y": 450}, {"id": "d_etp", "lane": 3, "label": "etp_tracker.db", "sub": "VPS \u00b7 authority (64 tables)", "h": "ok", "x": 1010, "y": 90}, {"id": "d_mkt", "lane": 3, "label": "mkt_master_data", "sub": "full-snapshot per sync", "h": "ok", "x": 1010, "y": 130}, {"id": "d_ts", "lane": 3, "label": "mkt_time_series", "sub": "36-mo AUM/flow", "h": "ok", "x": 1010, "y": 170}, {"id": "d_snap", "lane": 3, "label": "mkt_daily_snapshot", "sub": "VPS \u00b7 per-day field history", "h": "ok", "x": 1010, "y": 210}, {"id": "d_rex", "lane": 3, "label": "rex_products / status_history", "sub": "REX lifecycle authority", "h": "ok", "x": 1010, "y": 250}, {"id": "d_live", "lane": 3, "label": "live_feed.db", "sub": "VPS \u00b7 SEC live feed", "h": "ok", "x": 1010, "y": 290}, {"id": "d_render", "lane": 3, "label": "Render replica", "sub": "rexfinhub.com read DB", "h": "ok", "x": 1010, "y": 330}, {"id": "d_darch", "lane": 3, "label": "D: archive", "sub": "nightly tarballs + cache", "h": "ok", "x": 1010, "y": 370}, {"id": "o_daily", "lane": 4, "label": "Daily filing report", "sub": "filings + upcoming launches", "h": "ok", "x": 1340, "y": 90}, {"id": "o_weekly", "lane": 4, "label": "Weekly digest", "sub": "5-category landscape", "h": "ok", "x": 1340, "y": 130}, {"id": "o_li", "lane": 4, "label": "L&I report", "sub": "REX position + chart", "h": "ok", "x": 1340, "y": 170}, {"id": "o_income", "lane": 4, "label": "Income report", "sub": "covered-call + chart", "h": "ok", "x": 1340, "y": 210}, {"id": "o_flow", "lane": 4, "label": "Flow report", "sub": "per-suite CEO flows", "h": "ok", "x": 1340, "y": 250}, {"id": "o_blue", "lane": 4, "label": "Blue Ocean", "sub": "monthly 1st bus. day", "h": "ok", "x": 1340, "y": 290}, {"id": "o_port", "lane": 4, "label": "Portfolio suite", "sub": "20-fund suite flows", "h": "ok", "x": 1340, "y": 330}, {"id": "o_trex", "lane": 4, "label": "T-REX Stock recs", "sub": "Monday pipeline", "h": "ok", "x": 1340, "y": 370}, {"id": "o_brief", "lane": 4, "label": "T-REX Brief", "sub": "on-demand (names\u2192chat)", "h": "ok", "x": 1340, "y": 410}, {"id": "o_ms", "lane": 4, "label": "MicroSectors", "sub": "ETN overlay (dtype wart)", "h": "warn", "x": 1340, "y": 450}, {"id": "o_web", "lane": 4, "label": "rexfinhub.com", "sub": "Render webapp", "h": "ok", "x": 1340, "y": 490}], "edges": [{"from": "s_bbg", "to": "t_chain"}, {"from": "s_edgar", "to": "t_poller"}, {"from": "s_edgar", "to": "t_atom"}, {"from": "s_edgar", "to": "t_sec"}, {"from": "s_cboe", "to": "t_chain"}, {"from": "s_rules", "to": "p_fm"}, {"from": "t_chain", "to": "p_sync"}, {"from": "t_sec", "to": "p_sync"}, {"from": "t_intra", "to": "p_sync"}, {"from": "p_sync", "to": "p_class"}, {"from": "p_class", "to": "p_fm"}, {"from": "p_fm", "to": "p_iss"}, {"from": "p_iss", "to": "p_sweep"}, {"from": "p_sweep", "to": "p_recon"}, {"from": "p_recon", "to": "p_snap"}, {"from": "p_snap", "to": "p_commit"}, {"from": "t_recon", "to": "p_recon"}, {"from": "t_sweep", "to": "p_fm"}, {"from": "t_triage", "to": "p_assert"}, {"from": "t_pre", "to": "p_qc"}, {"from": "p_sync", "to": "d_mkt"}, {"from": "p_sync", "to": "d_ts"}, {"from": "d_mkt", "to": "d_etp"}, {"from": "p_snap", "to": "d_snap"}, {"from": "p_recon", "to": "d_rex"}, {"from": "t_atom", "to": "d_live"}, {"from": "p_commit", "to": "d_render"}, {"from": "t_backup", "to": "d_darch"}, {"from": "d_etp", "to": "d_darch"}, {"from": "d_mkt", "to": "o_daily"}, {"from": "d_mkt", "to": "o_weekly"}, {"from": "d_mkt", "to": "o_li"}, {"from": "d_mkt", "to": "o_income"}, {"from": "d_mkt", "to": "o_flow"}, {"from": "d_ts", "to": "o_li"}, {"from": "d_mkt", "to": "o_blue"}, {"from": "d_mkt", "to": "o_port"}, {"from": "d_rex", "to": "o_trex"}, {"from": "d_rex", "to": "o_brief"}, {"from": "d_mkt", "to": "o_ms"}, {"from": "d_render", "to": "o_web"}, {"from": "p_qc", "to": "o_li"}, {"from": "p_qc", "to": "o_income"}, {"from": "p_assert", "to": "d_etp"}], "lanes": ["Sources", "Schedulers (systemd)", "Pipeline stages", "Data stores", "Outputs"], "laneX": {"0": 40, "1": 320, "2": 660, "3": 1010, "4": 1340}, "laneW": 250, "height": 590, "fill": {"ok": "#14532d", "warn": "#78350f", "bad": "#7f1d1d"}, "stroke": {"ok": "#22c55e", "warn": "#f59e0b", "bad": "#ef4444"}};
const svg=document.getElementById('svg'), W=1620;
svg.setAttribute('width','100%'); svg.setAttribute('height','calc(100vh - 120px)');
svg.setAttribute('viewBox',`0 0 ${W} ${D.height}`);
const NS='http://www.w3.org/2000/svg', byId={};
const vp=document.createElementNS(NS,'g'); svg.appendChild(vp);  // pan/zoom viewport
D.nodes.forEach(n=>byId[n.id]=n);
const adjOut={}, adjIn={};
D.edges.forEach(e=>{(adjOut[e.from]=adjOut[e.from]||[]).push(e);(adjIn[e.to]=adjIn[e.to]||[]).push(e);});
D.lanes.forEach((l,i)=>{const t=document.createElementNS(NS,'text');t.setAttribute('x',D.laneX[i]);t.setAttribute('y',60);t.setAttribute('class','lane-h');t.textContent=l;vp.appendChild(t);});
const edgeEls=[];
D.edges.forEach(e=>{const a=byId[e.from],b=byId[e.to];if(!a||!b)return;const p=document.createElementNS(NS,'path');
 const x1=a.x+D.laneW,y1=a.y+17,x2=b.x,y2=b.y+17,mx=(x1+x2)/2;
 p.setAttribute('d',`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);p.setAttribute('class','edge');p._e=e;vp.appendChild(p);edgeEls.push(p);});
const nodeEls=[];
D.nodes.forEach(n=>{const g=document.createElementNS(NS,'g');g.setAttribute('class','node');
 const r=document.createElementNS(NS,'rect');r.setAttribute('x',n.x);r.setAttribute('y',n.y);r.setAttribute('width',D.laneW);r.setAttribute('height',34);
 r.setAttribute('fill',D.fill[n.h]);r.setAttribute('stroke',D.stroke[n.h]);
 const t1=document.createElementNS(NS,'text');t1.setAttribute('x',n.x+8);t1.setAttribute('y',n.y+15);t1.setAttribute('class','lbl');t1.textContent=n.label;
 const t2=document.createElementNS(NS,'text');t2.setAttribute('x',n.x+8);t2.setAttribute('y',n.y+27);t2.setAttribute('class','sub');t2.textContent=n.sub.length>40?n.sub.slice(0,39)+'…':n.sub;
 g.appendChild(r);g.appendChild(t1);g.appendChild(t2);g._n=n;g.onclick=(ev)=>{ev.stopPropagation();trace(n.id);};vp.appendChild(g);nodeEls.push(g);});
// ---- pan / zoom ----
let zk=1, px=0, py=0, dragging=false, sx=0, sy=0;
function apply(){vp.setAttribute('transform',`translate(${px},${py}) scale(${zk})`);}
svg.addEventListener('wheel',ev=>{ev.preventDefault();const f=ev.deltaY<0?1.12:1/1.12;
 const r=svg.getBoundingClientRect();const mx=(ev.clientX-r.left)/r.width*W,my=(ev.clientY-r.top)/r.height*D.height;
 px=mx-(mx-px)*f;py=my-(my-py)*f;zk*=f;apply();},{passive:false});
svg.addEventListener('mousedown',ev=>{dragging=true;sx=ev.clientX;sy=ev.clientY;});
window.addEventListener('mousemove',ev=>{if(!dragging)return;const r=svg.getBoundingClientRect();
 px+=(ev.clientX-sx)/r.width*W;py+=(ev.clientY-sy)/r.height*D.height;sx=ev.clientX;sy=ev.clientY;apply();});
window.addEventListener('mouseup',()=>dragging=false);
svg.addEventListener('dblclick',()=>{zk=1;px=0;py=0;apply();reset();});
function walk(id,adj,acc){(adj[id]||[]).forEach(e=>{const nxt=adj===adjOut?e.to:e.from;if(!acc.nodes.has(nxt)){acc.nodes.add(nxt);acc.edges.add(e);walk(nxt,adj,acc);}else acc.edges.add(e);});}
function trace(id){const acc={nodes:new Set([id]),edges:new Set()};walk(id,adjOut,acc);walk(id,adjIn,acc);
 nodeEls.forEach(g=>g.classList.toggle('dim',!acc.nodes.has(g._n.id)));
 edgeEls.forEach(p=>{const on=acc.edges.has(p._e);p.classList.toggle('hot',on);p.classList.toggle('dim',!on);});}
function reset(){nodeEls.forEach(g=>g.classList.remove('dim'));edgeEls.forEach(p=>p.classList.remove('hot','dim'));}
svg.addEventListener('click',e=>{if(e.target===svg)reset();});
document.getElementById('search').addEventListener('input',function(){const q=this.value.toLowerCase().trim();
 if(!q){reset();return;}
 nodeEls.forEach(g=>{const n=g._n;const hit=(n.label+' '+n.sub).toLowerCase().includes(q);g.classList.toggle('dim',!hit);});
 edgeEls.forEach(p=>p.classList.add('dim'));});
</script></body></html>
